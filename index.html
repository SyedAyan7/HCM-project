<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCM Lite - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="auth-container">

    <h1>HCM Lite</h1>
    <p>Human Capital Management System</p>

    <!-- Company Setup -->
    <section class="auth-card">
      <h2>Company Setup</h2>
      <p>Create your company account</p>

      <form>
        <label for="companyName">Company Name</label>
        <input type="text" id="companyName" placeholder="Enter company name">

        <label for="adminName">Admin Name</label>
        <input type="text" id="adminName" placeholder="Enter admin name">

        <label for="adminEmail">Admin Email</label>
        <input type="email" id="adminEmail" placeholder="Enter admin email">

        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" placeholder="Create password">

        <button type="button">Create Company</button>
      </form>
    </section>

    <!-- Login -->
    <section class="auth-card">
      <h2>Login</h2>
      <p>Welcome back!</p>

      <form>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">

        <label for="role">Login As</label>
        <select id="role">
          <option value="admin">Admin</option>
          <option value="employee">Employee</option>
        </select>

        <button type="button">Login</button>
      </form>
    </section>

  </main>

  <script src="js/storage.js"></script>
</body>

</html>
